version: '3.8'

services:
  diagnostic08finalcommit-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diagnostic08finalcommit:latest
    container_name: diagnostic08finalcommit-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      # External service connections - configure as needed
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS}
    volumes:
      - ./logs:/app/logs
      - ./appsettings:/app/appsettings:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  appsettings: